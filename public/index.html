<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benzeri</title>
<style>
  :root { --bg:#f6f7f9; --surface:#fff; --text:#1d2330; --muted:#6b7280; --accent:#16a34a; --border:#e3e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --surface:#1b1f27; --text:#e8ebf0; --muted:#9aa3b2; --accent:#4ade80; --border:#2a303b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; padding:0 16px; }
  main { max-width:760px; margin:0 auto; padding:24px 0 48px; }
  h1 { font-size:1.6rem; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  h1 svg { color:var(--accent); }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; }
  .drop { border:2px dashed var(--border); border-radius:12px; padding:28px; text-align:center; cursor:pointer; color:var(--muted); }
  .drop input { display:none; }
  #preview { display:none; max-width:100%; max-height:260px; border-radius:10px; margin-top:12px; }
  label { display:block; font-weight:600; margin:14px 0 6px; font-size:0.95rem; }
  input[type="text"], input[type="number"] { width:100%; padding:11px 12px; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:10px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px) { .row { grid-template-columns:1fr; } }
  button { margin-top:18px; width:100%; padding:13px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .hint, .status { font-size:0.85rem; color:var(--muted); margin-top:6px; }
  h2 { font-size:1.1rem; margin:0 0 12px; }
  .item { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); }
  .item:last-child { border-bottom:0; }
  .item img { width:64px; height:64px; object-fit:contain; border-radius:8px; background:var(--bg); flex-shrink:0; }
  .info { flex:1; min-width:0; }
  .info strong { display:block; font-size:0.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .info span { color:var(--muted); font-size:0.82rem; }
  .price { font-weight:700; color:var(--accent); white-space:nowrap; }
  .item a { color:var(--accent); text-decoration:none; font-weight:600; font-size:0.85rem; white-space:nowrap; padding:6px 10px; border:1px solid var(--accent); border-radius:8px; }
  .empty { color:var(--muted); text-align:center; padding:16px 0; }
</style>
</head>
<body>
<main>
  <h1>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/><circle cx="11" cy="11" r="2.6"/><path d="m13 13 2 2"/></svg>
    Benzeri
  </h1>
  <p class="sub">Beğendin, ama pahalı mı? Benzerini bul.</p>

  <div class="card">
    <label for="file">1. Ürün fotoğrafı (isteğe bağlı)</label>
    <div class="drop" id="drop">
      <input type="file" id="file" accept="image/*">
      <div id="dropText">Fotoğrafı buraya sürükle veya tıkla</div>
      <img id="preview" alt="Yüklenen ürün">
    </div>

    <label for="desc">2. Ürünü kısaca tarif et</label>
    <input type="text" id="desc" placeholder="Örn: siyah deri sırt çantası">
    <div class="hint">Marka ve model biliyorsan ekle, sonuçlar daha isabetli olur.</div>

    <div class="row">
      <div>
        <label for="brand">Marka (isteğe bağlı)</label>
        <input type="text" id="brand" placeholder="Örn: Samsonite">
      </div>
      <div>
        <label for="price">Gördüğün fiyat (TL, isteğe bağlı)</label>
        <input type="number" id="price" min="0" placeholder="Örn: 4500">
      </div>
    </div>

    <button id="go" disabled>Ucuz alternatifleri bul</button>
  </div>

  <div class="card" id="results" style="display:none">
    <h2 id="resTitle"></h2>
    <div id="resList"></div>
    <div class="status" id="tip"></div>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  let hasImage = false;

  function updateButton() {
    $("go").disabled = !($("desc").value.trim() || $("brand").value.trim());
  }
  $("desc").addEventListener("input", updateButton);
  $("brand").addEventListener("input", updateButton);

  $("file").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = ev => {
      $("preview").src = ev.target.result;
      $("preview").style.display = "block";
      $("dropText").style.display = "none";
      hasImage = true;
    };
    reader.readAsDataURL(file);
  });
  $("drop").addEventListener("click", () => $("file").click());

  function renderItem(p) {
    const row = document.createElement("div");
    row.className = "item";

    const img = document.createElement("img");
    img.src = p.thumbnail || "";
    img.alt = "";
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info";
    const title = document.createElement("strong");
    title.textContent = p.title || "Ürün";
    const src = document.createElement("span");
    src.textContent = p.source || "";
    info.append(title, src);

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = p.price || "";

    const link = document.createElement("a");
    link.href = p.link;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Git";

    row.append(img, info, price, link);
    return row;
  }

  $("go").addEventListener("click", async () => {
    const query = [$("brand").value.trim(), $("desc").value.trim()].filter(Boolean).join(" ");
    if (!query) return;
    const given = parseFloat($("price").value);

    $("resTitle").textContent = `"${query}" için sonuçlar`;
    $("resList").innerHTML = '<div class="empty">Aranıyor...</div>';
    $("tip").textContent = "";
    $("results").style.display = "block";
    $("results").scrollIntoView({ behavior: "smooth" });

    try {
      const r = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Arama başarısız");

      let items = data.results || [];
      if (!isNaN(given) && given > 0) {
        const cheaper = items.filter(p => p.extracted_price < given);
        if (cheaper.length) {
          items = cheaper;
          $("tip").textContent = `${given.toLocaleString("tr-TR")} TL'nin altındaki ${cheaper.length} ilan gösteriliyor.`;
        } else {
          $("tip").textContent = "Gördüğün fiyatın altında ilan bulunamadı. Tüm sonuçlar aşağıda.";
        }
      }

      $("resList").innerHTML = "";
      if (!items.length) {
        $("resList").innerHTML = '<div class="empty">Sonuç bulunamadı. Tarifi değiştirip tekrar dene.</div>';
        return;
      }
      items.forEach(p => $("resList").appendChild(renderItem(p)));
    } catch (err) {
      $("resList").innerHTML = '<div class="empty">Arama yapılamadı. Biraz sonra tekrar dene.</div>';
    }
  });
</script>
</body>
</html>
